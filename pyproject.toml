[project]
name = "contract-qa-agent"
version = "0.1.0"
description = "引用可核对的合同条款 RAG：条款级切分、混合检索、页码级引用"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5,<2",
  "langgraph>=0.2,<1",
  "pydantic>=2.9,<3",
  "pymupdf>=1.24,<2",
  "rank-bm25>=0.2.2,<1",
  "streamlit>=1.40,<2",
  "structlog>=24,<26",
]

[project.scripts]
contract-qa = "contract_qa.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_qa"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
